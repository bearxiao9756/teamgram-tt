server {
    # 监听 443 端口，启用 SSL/TLS
    listen 443 ssl;
    server_name webim.customgoodservice.icu;

    # 指向你的 SSL 证书和私钥文件
    ssl_certificate /etc/letsencrypt/live/webim.customgoodservice.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webim.customgoodservice.icu/privkey.pem;

    # 推荐的 SSL 设置（安全性和性能优化）
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 将所有 /apiw1 的 HTTPS 请求代理到后端
    location /apiw1 {
        # ... 保持你现有的代理配置，确保在 HTTPS 环境下仍然工作
        if ($request_method = 'OPTIONS') {
            # ... 你的 CORS 预检请求配置
            return 204;
        }
        
        # ... 其他 add_header 指令

        proxy_pass http://127.0.0.1:11443;
    }

    # 根目录下的所有 HTTPS 请求都由 Nginx 负责提供前端文件
    location / {
        root /path/to/your/frontend/files;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}